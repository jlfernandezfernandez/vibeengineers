services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctx}
      POSTGRES_DB: ${POSTGRES_DB:-ctx}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctx} -d ${POSTGRES_DB:-ctx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Primera vez: inicializar layout y credenciales S3 (una sola vez, persiste en el volumen):
  #   docker compose exec garage /garage layout assign -z dc1 -c 1G "$(docker compose exec garage /garage node id -q | cut -d@ -f1)"
  #   docker compose exec garage /garage layout apply --version 1
  #   docker compose exec garage /garage bucket create ctx
  #   docker compose exec garage /garage key create ctx-backend
  #   docker compose exec garage /garage bucket allow --read --write ctx --key ctx-backend
  # Copiar key ID y secret a S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY en .env.
  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ctx:ctx@postgres:5432/ctx}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4321}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-ctx}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  pgdata:
  garage-meta:
  garage-data:
