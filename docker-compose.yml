services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctx}
      POSTGRES_DB: ${POSTGRES_DB:-ctx}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctx} -d ${POSTGRES_DB:-ctx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4321}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4321:4321"
    depends_on:
      - backend

volumes:
  pgdata:
  garage-meta:
  garage-data:
